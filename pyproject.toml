# This project is ESP32 firmware; Python is here only to pin the PlatformIO
# version the Makefile drives. `uv sync` installs it into .venv, and
# `uv run pio ...` uses it. PlatformIO brings its own toolchain and Python
# dependencies, so nothing else belongs in this list.

[project]
name = "windlass-sensesp"
version = "0.1.0"
description = "SensESP firmware for a Heltec V3: engine sensing and windlass chain counting"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "platformio>=6.1.18",
]
