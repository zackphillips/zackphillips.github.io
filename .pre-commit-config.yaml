# Generated telemetry is written by the Pi daemon every couple of minutes and is
# never hand-edited. Whitespace/format hooks must leave it alone, or a human
# commit rewrites files the daemon immediately rewrites back.
exclude: '^data/telemetry/'

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      # instrument_log.json and logo.png both exceed the 500 KB default, and
      # both are committed intentionally.
      - id: check-added-large-files
        args: [--maxkb=4096]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-json
      - id: debug-statements

  - repo: local
    hooks:
      # docs.html reads docs/index.json to list the Markdown files; regenerate
      # it locally so a commit that adds an SOP also publishes it. Pushes made
      # through the GitHub web UI are covered by the docs-index workflow.
      - id: docs-index
        name: rebuild docs/index.json
        # Via uv, not bare `python`: the interpreter on PATH is whatever the
        # machine happens to have (3.8 here), and this script needs 3.11+ for
        # datetime.UTC plus pyyaml from the project environment.
        entry: uv run python -m scripts.build_docs_index
        language: system
        pass_filenames: false
        files: '^docs/.*\.md$'
