; PlatformIO Project Configuration File
;
; https://docs.platformio.org/page/projectconf.html
;
; This firmware targets a Heltec WiFi LoRa 32 V3 (ESP32-S3) and uses that
; board's OLED and Vext pin definitions, so only the Heltec environments are
; defined here. Adding another board means providing SDA_OLED, SCL_OLED,
; RST_OLED and Vext for it, or dropping the display code.
;
; - arduino_esp32s3:    Espressif's official platform, Arduino core 2.x
; - pioarduino_esp32s3: community platform, Arduino core 3.x

[platformio]

default_envs = arduino_esp32s3

[env]

; Lower the upload speed to 115200 if you have problems with uploading
upload_speed = 1500000
monitor_speed = 115200

lib_deps =
    SignalK/SensESP @ >=3.0.0-beta.6,<4.0.0-alpha.1
    eiannone/Heltec_Esp32_Display

build_flags =
    ; Max (and default) debugging level in Arduino ESP32 Core
    -D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_VERBOSE
    ; Use the ESP-IDF logging library - required by SensESP.
    -D USE_ESP_IDF_LOG
    ; Windlass chain counter GPIOs. Uncomment and edit to move them; the
    ; defaults are in src/main.cpp.
    ;-D CHAIN_SENSOR_GPIO=38
    ;-D CHAIN_UP_GPIO=39
    ;-D CHAIN_DOWN_GPIO=40

; "min_spiffs" has two app partitions, one for OTA updates and one for the
; running app, but a small SPIFFS filesystem. The Heltec V3 has 8 MB of flash,
; so "default_8MB.csv" is an option if you need the space.

board_build.partitions = min_spiffs.csv

;; Uncomment the following lines to use Over-the-air (OTA) Updates
;upload_protocol = espota
;upload_port = IP_ADDRESS_OF_ESP_HERE
;upload_flags =
;  --auth=YOUR_OTA_PASSWORD

build_unflags =
    -Werror=reorder
monitor_filters = esp32_exception_decoder

test_build_src = true
check_tool = clangtidy
check_flags =
    clangtidy: --fix --format-style=file --config-file=.clang-tidy

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; Platform configurations

[arduino]

platform = espressif32 @ ^6.9.0
framework = arduino

lib_ignore =
    esp_websocket_client

build_flags =
    ${env.build_flags}
    ; Arduino Core bug workaround: define the log tag for the Arduino
    ; logging macros.
    -D TAG='"Arduino"'

[pioarduino]

platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino

; The library.json format doesn't support dependencies conditional on the
; platform version, so the websocket client is pulled in here instead.

lib_deps =
    ${env.lib_deps}
    esp_websocket_client=https://components.espressif.com/api/downloads/?object_type=component&object_id=dbc87006-9a4b-45e6-a6ab-b286174cb413

build_flags =
    ${env.build_flags}

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; Board configuration

[esp32s3]

board = heltec_wifi_lora_32_V3
upload_protocol = esptool
build_flags =
    ${env.build_flags}

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; Environments

[env:arduino_esp32s3]

extends = arduino, esp32s3
build_flags =
    ${arduino.build_flags}
    ${esp32s3.build_flags}

[env:pioarduino_esp32s3]

extends = pioarduino, esp32s3
build_flags =
    ${pioarduino.build_flags}
    ${esp32s3.build_flags}
